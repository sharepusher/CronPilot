<!doctype html>
<html data-ui-mode="{{ ui_mode }}" data-theme="{{ theme }}"{% if sidebar_collapsed %} class="cp-sidebar-collapsed"{% endif %}>
<head>
    <title>CronPilot 定时调度平台</title>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="csrf-param" content="{{ csrf_param }}">

    <link href="{{ url_for('static',filename='js/simpleboot/themes/flat/theme.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static',filename='js/simpleboot/css/simplebootadmin.css') }}" rel="stylesheet">
    <link href="{{ url_for('static',filename='js/artDialog/skins/default.css') }}" rel="stylesheet"/>
    <link href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome.min.css') }}"
          rel="stylesheet" type="text/css">
    <link href="{{ url_for('static',filename='css/console-theme.css') }}" rel="stylesheet">
    <link href="{{ url_for('static',filename='css/console-mode.css') }}" rel="stylesheet">
    <style>
        form .input-order {
            margin-bottom: 0px;
            padding: 3px;
            width: 40px;
        }

        .table-actions {
            margin-top: 5px;
            margin-bottom: 5px;
            padding: 0px;
        }

        .table-list {
            margin-bottom: 0px;
        }

        .rbac-topbar {
            background-color: var(--cp-topbar-bg);
            color: var(--cp-topbar-text);
            padding: 6px 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 36px;
        }
        .rbac-topbar .topbar-identity {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .rbac-topbar .topbar-sep {
            color: var(--cp-topbar-muted);
            margin: 0 2px;
        }
        .rbac-topbar a {
            color: var(--cp-topbar-text);
            text-decoration: none;
        }
        .rbac-topbar a:hover {
            color: var(--cp-surface);
            text-decoration: underline;
        }
        .rbac-topbar .label {
            font-size: 12px;
            vertical-align: middle;
        }
        .rbac-topbar .topbar-role {
            border: 0;
            font-weight: 600;
            color: #fff;
        }
        /* 角色徽标颜色 + 执行状态徽标：已迁移到 console-theme.css */
    </style>
    {% block css %} {% endblock %}
    <!--[if IE 7]>
	<link rel="stylesheet" href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome-ie7.min.css') }}">
	<![endif]-->
    <script type="text/javascript">
        //全局变量
        var GV = {
            ROOT: "/",
            WEB_ROOT: "",
            JS_ROOT: "{{ url_for('static',filename='js/') }}",
            UPLOAD_URL: "/"
        };
    </script>
    <script src="{{ url_for('static',filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static',filename='js/wind.js') }}"></script>
    <script src="{{ url_for('static',filename='js/simpleboot/bootstrap/js/bootstrap.min.js') }}"></script>
    <script>
        $(function () {
            $("[data-toggle='tooltip']").tooltip();
        });
    </script>
</head>
<body>
{% if ui_mode == 'console' %}
{% include "rbac/_sidebar_console.html" %}
{% endif %}
<div class="cp-main-wrap">
{% block topbar %}
{% include "rbac/_topbar.html" %}
{% endblock %}
{% block content %}{% endblock %}
</div>
<script src="{{ url_for('static',filename='js/md5.js') }}"></script>
<script src="{{ url_for('static',filename='js/signs.js') }}"></script>
<script src="{{ url_for('static',filename='js/requests.js') }}"></script>
<script src="{{ url_for('static',filename='js/common.js') }}"></script>
{% block js %}{% endblock %}
</body>
</html>

{% extends "admin_base.html" %}

{% block content %}
    <div class="wrap">
        {% if show_nav %}{% include "rbac/_nav.html" %}{% endif %}
        <div style="text-align:center; padding: 80px 20px 60px;">
            <div style="font-size:56px; color:var(--cp-faint); margin-bottom:16px;">
                <i class="fa {{ icon }}"></i>
            </div>
            <h2 style="font-size:1.6em; color:var(--cp-ink); margin-bottom:8px;">{{ title }}</h2>
            <p style="color:var(--cp-muted); font-size:0.95em; margin-bottom:32px;">{{ description }}</p>
            <div>
                <a href="javascript:history.back()" style="color:var(--cp-accent-blue); margin-right:24px;">
                    <i class="fa fa-arrow-left"></i> 返回上一页
                </a>
                {% if home_url %}
                <a href="{{ home_url }}" style="color:var(--cp-accent-blue);">
                    <i class="fa fa-home"></i> {{ home_text }}
                </a>
                {% endif %}
            </div>
        </div>
    </div>
{% endblock %}

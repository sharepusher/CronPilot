name: Ruff lint

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff-lint.yml'
  pull_request:
    paths:
      - 'app/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff-lint.yml'

jobs:
  ruff-check:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/

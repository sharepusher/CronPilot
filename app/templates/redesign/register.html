<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申请注册 — CronPilot</title>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console-theme.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cp-bg);
      padding: 20px;
      color: var(--cp-text);
    }
    .auth-card {
      width: 440px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 24px;
      color: var(--cp-text);
    }
    .auth-logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--cp-signal);
      display: inline-block;
      flex-shrink: 0;
    }
    .auth-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .auth-subtitle { font-size: 12.5px; color: var(--cp-text-muted); margin-bottom: 22px; }
    .auth-field { margin-bottom: 14px; }
    .auth-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .auth-req { color: var(--cp-danger); }
    .auth-input,
    .auth-select,
    .auth-textarea {
      width: 100%;
      height: 34px;
      padding: 0 11px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border-strong);
      border-radius: 6px;
      color: var(--cp-text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-textarea {
      height: 70px;
      padding: 9px 11px;
      resize: vertical;
    }
    .auth-select { appearance: auto; }
    .auth-input:focus,
    .auth-select:focus,
    .auth-textarea:focus {
      outline: none;
      border-color: var(--cp-signal);
      box-shadow: 0 0 0 2px var(--cp-signal-bg);
    }
    .auth-input::placeholder,
    .auth-textarea::placeholder { color: var(--cp-text-faint); }
    .auth-hint { font-size: 11px; color: var(--cp-text-faint); margin-top: 4px; }
    .auth-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .auth-grid-2 .auth-field { margin-bottom: 0; }
    .input-with-toggle { position: relative; }
    .input-with-toggle .auth-input { padding-right: 36px; }
    .toggle-vis {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--cp-text-faint);
      border-radius: 4px;
      border: none;
      background: none;
      padding: 0;
    }
    .toggle-vis:hover { color: var(--cp-text); background: var(--cp-surface-2); }
    .toggle-vis svg { width: 14px; height: 14px; }
    .auth-checkbox-group {
      border: 1px solid var(--cp-border-strong);
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 12.5px;
    }
    .auth-checkbox-group label {
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
      font-weight: normal;
    }
    .auth-checkbox-group label:last-child { margin-bottom: 0; }
    .auth-checkbox-group input[type="checkbox"] { margin-right: 6px; }
    .auth-other-wrap { display: none; margin-top: 6px; }
    .auth-admin-warn {
      display: none;
      background: var(--cp-warn-bg);
      border: 1px solid var(--cp-warn-border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--cp-warn-dark);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }
    .auth-msg-err {
      background: var(--cp-danger-bg);
      border: 1px solid var(--cp-danger-border);
      color: var(--cp-danger);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .auth-btn {
      width: 100%;
      height: 38px;
      border: none;
      border-radius: 6px;
      background: var(--cp-signal);
      color: var(--cp-on-filled);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.12s;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--cp-text-muted);
    }
    .auth-footer a {
      color: var(--cp-signal);
      font-weight: 500;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }
    /* Confirm modal */
    .auth-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: color-mix(in srgb, var(--cp-text) 30%, transparent);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-modal-overlay.open { display: flex; }
    .auth-modal {
      width: 100%;
      max-width: 420px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .auth-modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--cp-border);
      font-size: 15px;
      font-weight: 600;
    }
    .auth-modal-body {
      padding: 16px 20px;
      font-size: 13px;
      color: var(--cp-text-muted);
    }
    .auth-modal-body table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .auth-modal-body td {
      padding: 6px 0;
      vertical-align: top;
      font-size: 13px;
      color: var(--cp-text);
    }
    .auth-modal-body td:first-child {
      font-weight: 600;
      width: 100px;
      white-space: nowrap;
      color: var(--cp-text);
    }
    .auth-modal-foot {
      padding: 12px 20px;
      border-top: 1px solid var(--cp-border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .auth-modal-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      color: var(--cp-text);
    }
    .auth-modal-btn-primary {
      background: var(--cp-signal);
      color: var(--cp-on-filled);
      border-color: var(--cp-signal);
    }
    .auth-modal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-field-reason { margin-bottom: 18px; }
    .auth-empty-hint { color: var(--cp-text-muted); font-size: 12px; }
    .auth-link-inline { color: var(--cp-signal); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-dot"></span>CronPilot
    </div>
    <div class="auth-title">申请注册</div>
    <div class="auth-subtitle">提交注册申请后，管理员将进行审核</div>

    {% if form_msg %}
    <div class="auth-msg-err">{{ form_msg }}</div>
    {% endif %}

    <form action="{{ url_for('rbac.register') }}" method="post" id="register-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="auth-field">
        <label class="auth-label" for="reg-email">公司邮箱 <span class="auth-req">*</span></label>
        <input type="email" id="reg-email" name="email" class="auth-input" required placeholder="your.name@company.com"
               value="{{ form_data.get('email', '') if form_data else '' }}" autocomplete="email">
        <div class="auth-hint">邮箱前缀将作为登录用户名</div>
      </div>

      <div class="auth-grid-2">
        <div class="auth-field">
          <label class="auth-label" for="reg-nickname">花名 <span class="auth-req">*</span></label>
          <input type="text" id="reg-nickname" name="nickname" class="auth-input" required placeholder="内部昵称" maxlength="64"
                 value="{{ form_data.get('nickname', '') if form_data else '' }}">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="job-title-select">岗位类型 <span class="auth-req">*</span></label>
          <select name="job_title" id="job-title-select" class="auth-select" required>
            <option value="">-- 请选择 --</option>
            {% for code, label in job_title_choices %}
            <option value="{{ code }}"
              {% if form_data and form_data.get('job_title') == code %}selected{% endif %}>
              {{ label }}
            </option>
            {% endfor %}
          </select>
          <div class="auth-other-wrap" id="job-title-other-wrapper">
            <input type="text" name="job_title_other" class="auth-input" placeholder="请输入具体岗位名称（限 20 字符）" maxlength="20"
                   value="{{ form_data.get('job_title_other', '') if form_data else '' }}">
          </div>
        </div>
      </div>

      <div class="auth-grid-2">
        <div class="auth-field">
          <label class="auth-label" for="reg-pwd-input">密码 <span class="auth-req">*</span></label>
          <div class="input-with-toggle">
            <input type="password" id="reg-pwd-input" name="password" class="auth-input" required placeholder="至少 6 位" autocomplete="new-password">
            <button type="button" class="toggle-vis" data-target="reg-pwd-input" title="显示/隐藏密码" aria-label="显示/隐藏密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="reg-pwd-confirm">确认密码 <span class="auth-req">*</span></label>
          <div class="input-with-toggle">
            <input type="password" id="reg-pwd-confirm" name="confirm_password" class="auth-input" required placeholder="再次输入密码" autocomplete="new-password">
            <button type="button" class="toggle-vis" data-target="reg-pwd-confirm" title="显示/隐藏密码" aria-label="显示/隐藏密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="auth-grid-2">
        <div class="auth-field">
          <label class="auth-label" for="role-select">申请角色 <span class="auth-req">*</span></label>
          <select name="role" id="role-select" class="auth-select" required>
            {% for r in roles %}
            <option value="{{ r }}"
              {% if form_data and form_data.get('role') == r %}selected{% endif %}>
              {{ r }}
            </option>
            {% endfor %}
          </select>
          <div class="auth-hint">operator 可写任务；viewer 仅查看</div>
          <div class="auth-admin-warn" id="admin-warning">
            管理员角色审批更严格，请确保个人信息和申请缘由准确完整。
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-label">目标业务组 <span class="auth-req">*</span></label>
          <div class="auth-checkbox-group" id="group-checkboxes">
            {% for g in groups %}
            <label class="group-item-label">
              <input type="checkbox" name="group_ids" value="{{ g.id }}" class="group-item-cb"
                {% if form_data and g.id|string in form_data.getlist('group_ids') %}checked{% endif %}>
              {{ g.name }}
            </label>
            {% endfor %}
            {% if not groups %}
            <span class="auth-empty-hint">暂无业务组</span>
            {% endif %}
            <label id="group-all-label" style="display:none;font-weight:600">
              <input type="checkbox" name="group_ids" value="__ALL__" id="group-all-cb"
                {% if form_data and '__ALL__' in form_data.getlist('group_ids') %}checked{% endif %}>
              全部（全局权限）
            </label>
          </div>
          <div class="auth-hint">至少选择一个业务组</div>
        </div>
      </div>

      <div class="auth-field auth-field-reason">
        <label class="auth-label" for="reg-reason">申请原因 <span class="auth-req">*</span></label>
        <textarea id="reg-reason" name="reason" class="auth-textarea" required placeholder="请简述申请原因和工作职责（最多 500 字）…" maxlength="500">{{ form_data.get('reason', '') if form_data else '' }}</textarea>
      </div>

      <button type="button" class="auth-btn" id="submit-btn">提交申请</button>
    </form>

    <div class="auth-footer">
      已有账号？<a href="{{ url_for('rbac.login') }}">返回登录</a>
    </div>
  </div>

  <div class="auth-modal-overlay" id="reg-confirm-modal">
    <div class="auth-modal">
      <div class="auth-modal-head">确认注册信息</div>
      <div class="auth-modal-body">
        <p>请仔细核对以下信息，确认无误后提交：</p>
        <table><tbody id="confirm-summary"></tbody></table>
      </div>
      <div class="auth-modal-foot">
        <button type="button" class="auth-modal-btn" id="modal-cancel-btn">返回修改</button>
        <button type="button" class="auth-modal-btn auth-modal-btn-primary" id="confirm-submit-btn">确认提交</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var roleSelect = document.getElementById('role-select');
    var adminWarning = document.getElementById('admin-warning');
    var jobTitleSelect = document.getElementById('job-title-select');
    var otherWrapper = document.getElementById('job-title-other-wrapper');
    var groupAllLabel = document.getElementById('group-all-label');
    var groupAllCb = document.getElementById('group-all-cb');
    var groupItemCbs = document.querySelectorAll('.group-item-cb');
    var form = document.getElementById('register-form');
    var submitBtn = document.getElementById('submit-btn');
    var modal = document.getElementById('reg-confirm-modal');
    var confirmBtn = document.getElementById('confirm-submit-btn');
    var modalCancelBtn = document.getElementById('modal-cancel-btn');

    function toggleAdminGroupUI() {
      var isAdmin = roleSelect.value === 'admin';
      adminWarning.style.display = isAdmin ? 'block' : 'none';
      groupAllLabel.style.display = isAdmin ? 'block' : 'none';
      if (!isAdmin && groupAllCb.checked) {
        groupAllCb.checked = false;
      }
    }
    roleSelect.addEventListener('change', toggleAdminGroupUI);
    toggleAdminGroupUI();

    groupAllCb.addEventListener('change', function() {
      if (this.checked) {
        groupItemCbs.forEach(function(cb) { cb.checked = false; });
      }
    });
    groupItemCbs.forEach(function(cb) {
      cb.addEventListener('change', function() {
        if (this.checked && groupAllCb.checked) {
          groupAllCb.checked = false;
        }
      });
    });

    jobTitleSelect.addEventListener('change', function() {
      otherWrapper.style.display = this.value === 'other' ? 'block' : 'none';
    });
    if (jobTitleSelect.value === 'other') {
      otherWrapper.style.display = 'block';
    }

    document.querySelectorAll('.toggle-vis').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var id = btn.getAttribute('data-target');
        var input = id ? document.getElementById(id) : btn.parentElement.querySelector('input');
        if (!input) return;
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    submitBtn.addEventListener('click', function() {
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      var email = form.querySelector('[name="email"]').value;
      var nickname = form.querySelector('[name="nickname"]').value;
      var role = form.querySelector('[name="role"]').value;
      var jobSel = form.querySelector('[name="job_title"]');
      var jobTitle = jobSel.options[jobSel.selectedIndex].text;
      if (jobSel.value === 'other') {
        var custom = form.querySelector('[name="job_title_other"]').value;
        jobTitle = '其他：' + (custom || '未填写');
      }
      var groups = [];
      form.querySelectorAll('[name="group_ids"]:checked').forEach(function(cb) {
        groups.push(cb.value === '__ALL__' ? '全部（全局权限）' : cb.parentElement.textContent.trim());
      });
      var reason = form.querySelector('[name="reason"]').value;
      var rows = [
        ['邮箱（用户名）', email],
        ['花名', nickname],
        ['岗位类型', jobTitle],
        ['申请角色', role],
        ['目标业务组', groups.join('、') || '未选择'],
        ['申请原因', reason.length > 80 ? reason.substring(0, 80) + '…' : reason],
      ];
      var tbody = document.getElementById('confirm-summary');
      tbody.innerHTML = '';
      rows.forEach(function(r) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + escHtml(r[0]) + '</td><td>' + escHtml(r[1]) + '</td>';
        tbody.appendChild(tr);
      });
      modal.classList.add('open');
    });

    modalCancelBtn.addEventListener('click', function() {
      modal.classList.remove('open');
    });
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.classList.remove('open');
    });

    confirmBtn.addEventListener('click', function() {
      if (confirmBtn.disabled) return;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '提交中…';
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中…';
      modal.classList.remove('open');
      form.submit();
    });
  })();
  </script>
</body>
</html>

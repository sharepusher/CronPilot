# 可选：Supervisor 管理（新镜像默认 CMD 直接跑 run_production.sh，无需 supervisord）
[supervisord]
nodaemon=true

[program:cronpilot]
command=/opt/cronpilot/docker_start.sh
directory=/opt/cronpilot
user=cronpilot
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/cronpilot/datas/logs/server.log
loglevel=error
stopasgroup=true
stopsignal=QUIT

{% extends "admin_base.html" %}

{% block content %}
    <div class="wrap">
        <div class="jumbotron">
            <div style="text-align: center">
                <h1 class="display-4">CronPilot 定时调度平台</h1>
                <p class="lead">&nbsp;&nbsp;方便、统一、自由</p>
            </div>
        </div>

        {% with active='password' %}
        {% include "rbac/_nav.html" %}
        {% endwith %}

        {% if form_msg %}
        <div style="color:red;margin:8px 0">{{ form_msg }}</div>
        {% endif %}

        <form method="post" class="form-horizontal js-ajax-form" action="{{ url_for('rbac.change_password') }}">
            <fieldset>
                <div class="control-group">
                    <label class="control-label">当前账号</label>
                    <div class="controls">
                        <input type="text" value="{{ current_user.username if current_user else '' }}" disabled />
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">当前密码</label>
                    <div class="controls">
                        <input type="password" name="old_password" required autocomplete="current-password" />
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">新密码</label>
                    <div class="controls">
                        <input type="password" name="new_password" required minlength="6" autocomplete="new-password" />
                        <span style="color:#64748b">至少 6 位，且不能与当前密码相同</span>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">确认新密码</label>
                    <div class="controls">
                        <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password" />
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                    <a class="btn" href="{{ url_for('main.cron_list') }}">返回</a>
                </div>
            </fieldset>
        </form>
    </div>
{% endblock %}

# 与 docker-compose.yml 相同（兼容旧文档中的 -f docker-compose.run.yml）
services:
  cronpilot:
    build: .
    ports:
      - "5860:5860"
    volumes:
      - ./datas:/opt/cronpilot/datas
      - ./conf.ini:/opt/cronpilot/conf.ini
    environment:
      FLASK_CONFIG: production
      PYTHONIOENCODING: utf-8
    restart: unless-stopped

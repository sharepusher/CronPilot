<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>CronPilot · 注册申请</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/console-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome.min.css') }}">
    <script src="{{ url_for('static',filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static',filename='js/common.js') }}"></script>
    <script src="{{ url_for('static',filename='js/bootstrap.min.js') }}"></script>
    <style>
        body { background: var(--cp-surface-3); }
        .register-container { max-width: 580px; margin: 40px auto; padding: 0 16px; }
        .register-header { text-align: center; margin-bottom: 28px; }
        .register-header h1 { font-size: 1.6em; color: var(--cp-ink); margin-bottom: 4px; }
        .register-header p { color: var(--cp-muted); font-size: 0.95em; }
        .register-card {
            background: var(--cp-surface);
            border: 1px solid var(--cp-border);
            border-radius: 8px;
            padding: 28px 32px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9em; color: var(--cp-ink); margin-bottom: 4px; }
        .form-group label .required { color: var(--cp-danger); margin-left: 2px; }
        .form-group .field-hint { font-size: 0.82em; color: var(--cp-muted); margin-top: 3px; }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select,
        .form-group textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--cp-border); border-radius: 4px; font-size: 0.92em; }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .form-group select { height: 34px; }
        .checkbox-group { max-height: 160px; overflow-y: auto; border: 1px solid var(--cp-border); border-radius: 4px; padding: 8px 12px; }
        .checkbox-group label { font-weight: normal; display: block; margin-bottom: 4px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { margin-right: 6px; }
        .admin-warning {
            display: none;
            background: var(--cp-warn-bg);
            border: 1px solid var(--cp-warn-border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--cp-warn-dark);
            font-size: 0.88em;
            margin-top: 8px;
        }
        .admin-warning i { margin-right: 6px; color: var(--cp-warn-icon); }
        .form-actions { text-align: center; margin-top: 24px; }
        .form-actions .btn { margin: 0 8px; min-width: 100px; }
        .form-msg {
            background: var(--cp-danger-bg);
            border: 1px solid var(--cp-danger-border);
            color: var(--cp-danger);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.9em;
        }
        .form-msg i { margin-right: 6px; }
        .other-input-wrapper { display: none; margin-top: 6px; }
        .pwd-wrapper { position: relative; display: block; }
        .pwd-wrapper input { padding-right: 34px; }
        .pwd-wrapper .js-pwd-toggle {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: var(--cp-neutral); font-size: 14px; line-height: 1;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <h1>CronPilot 定时调度平台</h1>
        <p>用户注册申请</p>
    </div>
    <div class="register-card">
        {% if form_msg %}
        <div class="form-msg"><i class="fa fa-exclamation-circle"></i>{{ form_msg }}</div>
        {% endif %}

        <form action="{{ url_for('rbac.register') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label>公司邮箱 <span class="required">*</span></label>
                <input type="email" name="email" required placeholder="your.name@company.com"
                       value="{{ form_data.get('email', '') if form_data else '' }}">
                <div class="field-hint">邮箱前缀将作为登录用户名</div>
            </div>

            <div class="form-group">
                <label>花名 <span class="required">*</span></label>
                <input type="text" name="nickname" required placeholder="内部昵称" maxlength="64"
                       value="{{ form_data.get('nickname', '') if form_data else '' }}">
            </div>

            <div class="form-group">
                <label>岗位类型 <span class="required">*</span></label>
                <select name="job_title" id="job-title-select">
                    <option value="">-- 请选择 --</option>
                    {% for code, label in job_title_choices %}
                    <option value="{{ code }}"
                        {% if form_data and form_data.get('job_title') == code %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
                <div class="other-input-wrapper" id="job-title-other-wrapper">
                    <input type="text" name="job_title_other" placeholder="请输入具体岗位名称（限 20 字符）" maxlength="20"
                           value="{{ form_data.get('job_title_other', '') if form_data else '' }}">
                </div>
            </div>

            <div class="form-group">
                <label>密码 <span class="required">*</span></label>
                <div class="pwd-wrapper">
                    <input type="password" name="password" required placeholder="至少 6 位" id="reg-pwd-input">
                    <i class="fa fa-eye-slash js-pwd-toggle" data-target="reg-pwd-input" title="显示/隐藏密码"></i>
                </div>
            </div>

            <div class="form-group">
                <label>确认密码 <span class="required">*</span></label>
                <div class="pwd-wrapper">
                    <input type="password" name="confirm_password" required placeholder="再次输入密码" id="reg-pwd-confirm">
                    <i class="fa fa-eye-slash js-pwd-toggle" data-target="reg-pwd-confirm" title="显示/隐藏密码"></i>
                </div>
            </div>

            <div class="form-group">
                <label>申请角色 <span class="required">*</span></label>
                <select name="role" id="role-select">
                    {% for r in roles %}
                    <option value="{{ r }}"
                        {% if form_data and form_data.get('role') == r %}selected{% endif %}>
                        {{ r }}
                    </option>
                    {% endfor %}
                </select>
                <div class="field-hint">operator 可写任务；viewer 仅查看</div>
                <div class="admin-warning" id="admin-warning">
                    <i class="fa fa-exclamation-triangle"></i>管理员角色申请将由系统管理员审批，审批周期可能较长。
                </div>
            </div>

            <div class="form-group">
                <label>目标业务组 <span class="required">*</span></label>
                <div class="checkbox-group">
                    {% for g in groups %}
                    <label>
                        <input type="checkbox" name="group_ids" value="{{ g.id }}"
                            {% if form_data and g.id|string in form_data.getlist('group_ids') %}checked{% endif %}>
                        {{ g.name }}
                    </label>
                    {% endfor %}
                    {% if not groups %}
                    <span style="color: var(--cp-muted); font-size: 0.9em;">暂无业务组</span>
                    {% endif %}
                </div>
                <div class="field-hint">至少选择一个业务组。没有目标业务组？请联系管理员创建后再申请</div>
            </div>

            <div class="form-group">
                <label>申请缘由 <span class="required">*</span></label>
                <textarea name="reason" required placeholder="请简述申请原因（最多 500 字）" maxlength="500">{{ form_data.get('reason', '') if form_data else '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">提交申请</button>
                <a href="{{ url_for('rbac.login') }}" class="btn btn-default">返回登录</a>
            </div>
        </form>
    </div>
</div>

<script>
$(function() {
    var roleSelect = document.getElementById('role-select');
    var adminWarning = document.getElementById('admin-warning');
    var submitBtn = document.getElementById('submit-btn');
    var jobTitleSelect = document.getElementById('job-title-select');
    var otherWrapper = document.getElementById('job-title-other-wrapper');

    roleSelect.addEventListener('change', function() {
        adminWarning.style.display = this.value === 'admin' ? 'block' : 'none';
    });
    if (roleSelect.value === 'admin') {
        adminWarning.style.display = 'block';
    }

    jobTitleSelect.addEventListener('change', function() {
        if (this.value === 'other') {
            otherWrapper.style.display = 'block';
        } else {
            otherWrapper.style.display = 'none';
        }
    });
    if (jobTitleSelect.value === 'other') {
        otherWrapper.style.display = 'block';
    }

    $(document).on('click', '.js-pwd-toggle', function() {
        var id = $(this).data('target');
        var inp = document.getElementById(id);
        if (!inp) return;
        inp.type = inp.type === 'password' ? 'text' : 'password';
        $(this).toggleClass('fa-eye fa-eye-slash');
    });
});
</script>
</body>
</html>

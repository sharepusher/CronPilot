<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CronPilot · 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="csrf-param" content="{{ csrf_param }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome.min.css') }}">
    <script src="{{ url_for('static',filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static',filename='js/bootstrap.min.js') }}"></script>
</head>
<body>
<div class="jumbotron" style="background-color: white;">
    <div style="text-align: center">
        <h1 class="display-4">CronPilot 定时调度平台</h1>
        <p class="lead">&nbsp;&nbsp;方便、统一、自由</p>
    </div>
</div>
<div style="text-align: center">
<form action="{{ url_for('rbac.login') }}" method="post" class="well form-search form-inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <input type="text" name="username" value="" placeholder="用户名" class="form-control" required>
    <span style="position:relative;display:inline-block;vertical-align:middle">
        <input type="password" name="password" value="" placeholder="密码" class="form-control" required id="login-pwd-input" style="padding-right:34px">
        <i class="fa fa-eye-slash js-pwd-toggle" data-target="login-pwd-input" title="显示/隐藏密码" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--cp-neutral);font-size:14px;line-height:1"></i>
    </span>
    <input type="submit" value="确定" class="btn btn-primary">
</form>
    {% if msg %}
<div style="text-align: center;font-size: 1.2em;color: red">
       {{ msg }}
    </div>
{% endif %}
</div>
</body>
<script>
$(document).on('click', '.js-pwd-toggle', function() {
    var id = $(this).data('target');
    var inp = document.getElementById(id);
    if (!inp) return;
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $(this).toggleClass('fa-eye fa-eye-slash');
});
</script>
</html>

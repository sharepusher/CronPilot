# CronPilot Docker（v0.1.1+，Python 3.10，默认 SQLite 试用）
# 用法: docker compose up --build -d
services:
  cronpilot:
    build: .
    ports:
      - "5860:5860"
    volumes:
      - ./datas:/opt/cronpilot/datas
      - ./conf.ini:/opt/cronpilot/conf.ini
    environment:
      FLASK_CONFIG: production
      PYTHONIOENCODING: utf-8
      # 宿主机 export SECRET_KEY 或由 verify/run_production 写入 datas/.flask_secret_key
      SECRET_KEY: ${SECRET_KEY:-}
    restart: unless-stopped

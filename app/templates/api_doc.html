{% extends "admin_base.html" %}

{% block css %}
<style>
  .swagger-frame-wrap { margin-top: 4px; }
  .swagger-frame-wrap iframe {
    width: 100%;
    height: calc(100vh - 240px);
    min-height: 500px;
    border: none;
    display: block;
  }
  .swagger-tip { margin-bottom: 6px; color: #888; font-size: 13px; }
  .swagger-tip a { color: #337ab7; }
</style>
{% endblock %}

{% block content %}
<div class="wrap">
    <div class="jumbotron">
        <div style="text-align: center">
            <h1 class="display-4">CronPilot 定时调度平台</h1>
            <p class="lead">&nbsp;&nbsp;方便、统一、自由</p>
        </div>
    </div>

    {% with active='api_doc' %}
    {% include "rbac/_nav.html" %}
    {% endwith %}

    <div class="swagger-frame-wrap">
        <p class="swagger-tip">
            以下为自动生成的 API 文档（OpenAPI 3.0）。
            <a href="/api/swagger" target="_blank">在新标签页打开 &rarr;</a>
            &nbsp;|&nbsp;
            <a href="/api/openapi.json" target="_blank">下载 JSON Spec</a>
        </p>
        <iframe src="/api/swagger" title="CronPilot API 文档（Swagger UI）" allowfullscreen></iframe>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
(function () {
    var frame = document.querySelector('.swagger-frame-wrap iframe');
    if (!frame) return;
    frame.addEventListener('load', function () {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;

            /* static CSS: hide openapi.json link, servers, title block */
            var style = doc.createElement('style');
            style.textContent = [
                '.swagger-ui .info .url { display: none !important; }',
                '.swagger-ui .scheme-container { display: none !important; }',
                '.swagger-ui .information-container { display: none !important; }',
                '.swagger-ui .wrapper { padding-top: 10px !important; }'
            ].join('\n');
            doc.head.appendChild(style);

            /* hide "Parameters / No parameters" section whenever it appears */
            function hideEmptyParams(root) {
                var containers = root.querySelectorAll ? root.querySelectorAll('.parameters-container') : [];
                Array.from(containers).forEach(function (c) {
                    var wrapper = c.querySelector('.opblock-description-wrapper');
                    if (wrapper && wrapper.textContent.trim() === 'No parameters') {
                        /* Hide only .parameters-container and its sibling
                           .opblock-section-header; do NOT hide the parent
                           .opblock-section itself (it also wraps Request body) */
                        c.style.display = 'none';
                        var parent = c.parentElement;
                        if (parent) {
                            var header = parent.querySelector(':scope > .opblock-section-header');
                            if (header) header.style.display = 'none';
                        }
                    }
                });
            }

            /* 1. initial scan (in case anything is pre-rendered) */
            hideEmptyParams(doc.body);

            /* 2. MutationObserver for React DOM inserts */
            var observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    m.addedNodes.forEach(function (node) {
                        if (node.nodeType === 1) hideEmptyParams(node);
                    });
                });
            });
            observer.observe(doc.body, { childList: true, subtree: true });

            /* 3. polling fallback for 10 s (100 ms interval) */
            var count = 0;
            var poll = setInterval(function () {
                hideEmptyParams(doc.body);
                if (++count > 100) clearInterval(poll);
            }, 100);

        } catch (e) { /* cross-origin guard */ }
    });
}());
</script>
{% endblock %}

name: Public release asset

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Resolve release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Reject malformed release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check version and release-note consistency
        run: python scripts/check_version_consistency.py --check --tag "$GITHUB_REF_NAME"

      - name: Verify structured release readiness
        run: |
          jq -e --arg version "$VERSION" \
            '.version == $version and (.readiness == "ready" or .readiness == "published") and .release_blockers == []' \
            release/release-manifest.json >/dev/null

      - name: Validate documentation image governance
        run: python scripts/check_doc_image_assets.py --check

      - name: Build deterministic asset twice
        run: |
          python scripts/build_release_asset.py --version "$VERSION" --ref "$GITHUB_REF_NAME" --output "dist/cronpilot-$VERSION.tar.gz"
          python scripts/build_release_asset.py --version "$VERSION" --ref "$GITHUB_REF_NAME" --output "dist/rebuild-cronpilot-$VERSION.tar.gz"
          cmp "dist/cronpilot-$VERSION.tar.gz" "dist/rebuild-cronpilot-$VERSION.tar.gz"
          cp release/release-manifest.json "dist/release-manifest.json"

      - name: Validate public asset contract
        run: python scripts/check_release_asset.py --archive "dist/cronpilot-$VERSION.tar.gz" --version "$VERSION"

      - name: Prepare versioned GitHub Release notes
        run: python scripts/extract_release_notes.py --version "$VERSION" --output dist/release-notes.md --require-version-section

      - name: Verify extracted installation and startup
        run: |
          mkdir -p "$RUNNER_TEMP/cronpilot-release-check"
          tar -xzf "dist/cronpilot-$VERSION.tar.gz" -C "$RUNNER_TEMP/cronpilot-release-check"
          cd "$RUNNER_TEMP/cronpilot-release-check/cronpilot-$VERSION"
          bash scripts/bootstrap_venv.sh
          bash scripts/verify_golden_path.sh

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: release-assets
          path: dist

      - name: Resolve and validate release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create or refresh draft Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/cronpilot-$VERSION.tar.gz"
            "dist/cronpilot-$VERSION.tar.gz.sha256"
            "dist/cronpilot-$VERSION.tar.gz.build.json"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "CronPilot $VERSION" \
              --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "CronPilot $VERSION" \
              --notes-file dist/release-notes.md
          fi
          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,tagName)"
          jq -e --arg tag "$GITHUB_REF_NAME" '.tagName == $tag and .isDraft == true' <<<"$release_state" >/dev/null
          release_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            asset_name="${asset#dist/}"
            if ! grep -Fqx "$asset_name" <<<"$release_assets"; then
              echo "Release asset is missing after upload: $asset_name" >&2
              exit 1
            fi
          done
          rm -rf remote-assets
          mkdir -p remote-assets
          gh release download "$GITHUB_REF_NAME" \
            --pattern "cronpilot-$VERSION.tar.gz" \
            --pattern "cronpilot-$VERSION.tar.gz.sha256" \
            --pattern "cronpilot-$VERSION.tar.gz.build.json" \
            --dir remote-assets --clobber
          cmp "dist/cronpilot-$VERSION.tar.gz" "remote-assets/cronpilot-$VERSION.tar.gz"
          cmp "dist/cronpilot-$VERSION.tar.gz.sha256" "remote-assets/cronpilot-$VERSION.tar.gz.sha256"
          cmp "dist/cronpilot-$VERSION.tar.gz.build.json" "remote-assets/cronpilot-$VERSION.tar.gz.build.json"
          (cd remote-assets && sha256sum -c "cronpilot-$VERSION.tar.gz.sha256")
          jq -e --arg commit "$GITHUB_SHA" '.source_commit == $commit' \
            "remote-assets/cronpilot-$VERSION.tar.gz.build.json" >/dev/null
          jq -e --arg version "$VERSION" \
            '.version == $version and (.readiness == "ready" or .readiness == "published") and .release_blockers == []' \
            "dist/release-manifest.json" >/dev/null
          release_body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          for required_text in \
            "cronpilot-$VERSION.tar.gz" \
            "cronpilot-$VERSION.tar.gz.sha256" \
            "Source code" \
            "not recommended for production deployment"; do
            if ! grep -Fq "$required_text" <<<"$release_body"; then
              echo "Release body is missing required deployment-boundary text: $required_text" >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

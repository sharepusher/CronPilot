name: Version consistency check

on:
  push:
    branches: [main, master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'doc/交付状态与路线图.html'
      - 'scripts/check_version_consistency.py'
      - '.github/workflows/version-consistency.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'doc/交付状态与路线图.html'
      - 'scripts/check_version_consistency.py'
      - '.github/workflows/version-consistency.yml'

jobs:
  version-check:
    name: Git tags ↔ docs version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version consistency
        run: python scripts/check_version_consistency.py --check

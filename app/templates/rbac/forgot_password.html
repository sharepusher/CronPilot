<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>CronPilot · 忘记密码</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/console-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome.min.css') }}">
    <style>
        body { background: var(--cp-surface-3); }
        .forgot-container { max-width: 520px; margin: 60px auto; padding: 0 16px; }
        .forgot-header { text-align: center; margin-bottom: 28px; }
        .forgot-header h1 { font-size: 1.6em; color: var(--cp-ink); margin-bottom: 4px; }
        .forgot-header p { color: var(--cp-muted); font-size: 0.95em; }
        .info-box {
            background: var(--cp-accent-bg);
            border: 1px solid var(--cp-accent-border);
            border-radius: 8px;
            padding: 20px 24px;
            line-height: 1.7;
            color: var(--cp-ink);
            font-size: 0.95em;
        }
        .info-box i { color: var(--cp-accent-blue); margin-right: 8px; font-size: 1.1em; }
        .info-box p { margin: 6px 0; }
        .back-link { text-align: center; margin-top: 24px; }
        .back-link a { color: var(--cp-accent-blue); font-size: 0.95em; }
    </style>
</head>
<body>
<div class="forgot-container">
    <div class="forgot-header">
        <h1>CronPilot 定时调度平台</h1>
        <p>忘记密码</p>
    </div>
    <div class="info-box">
        <p><i class="fa fa-info-circle"></i>如忘记密码，请联系您所在业务组的管理员进行密码重置。</p>
        <p style="padding-left: 22px;">如不确定管理员是谁，请联系系统管理员。</p>
    </div>
    <div class="back-link">
        <a href="{{ url_for('rbac.login') }}"><i class="fa fa-arrow-left"></i> 返回登录</a>
    </div>
</div>
</body>
</html>

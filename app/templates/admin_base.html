<!doctype html>
<html>
<head>
    <title>CronPilot 定时调度平台</title>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
    <![endif]-->

    <link href="{{ url_for('static',filename='js/simpleboot/themes/flat/theme.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static',filename='js/simpleboot/css/simplebootadmin.css') }}" rel="stylesheet">
    <link href="{{ url_for('static',filename='js/artDialog/skins/default.css') }}" rel="stylesheet"/>
    <link href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome.min.css') }}"
          rel="stylesheet" type="text/css">
    <style>
        form .input-order {
            margin-bottom: 0px;
            padding: 3px;
            width: 40px;
        }

        .table-actions {
            margin-top: 5px;
            margin-bottom: 5px;
            padding: 0px;
        }

        .table-list {
            margin-bottom: 0px;
        }

        .rbac-topbar {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 6px 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 36px;
        }
        .rbac-topbar .topbar-identity {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .rbac-topbar .topbar-sep {
            color: #7f8c8d;
            margin: 0 2px;
        }
        .rbac-topbar a {
            color: #ecf0f1;
            text-decoration: none;
        }
        .rbac-topbar a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .rbac-topbar .label {
            font-size: 12px;
            vertical-align: middle;
        }
        .rbac-topbar .topbar-role {
            border: 0;
            font-weight: 600;
            color: #fff;
        }
        /* 深色顶栏上避免灰蓝 primary，按角色用清晰色相 */
        .rbac-topbar .topbar-role-seed {
            background-color: #e67e22;
        }
        .rbac-topbar .topbar-role-admin {
            background-color: #2980b9;
        }
        .rbac-topbar .topbar-role-operator {
            background-color: #16a085;
        }
        .rbac-topbar .topbar-role-viewer {
            background-color: #27ae60;
        }
        .rbac-topbar .topbar-role-default {
            background-color: #3498db;
        }
    </style>
    {% block css %} {% endblock %}
    <!--[if IE 7]>
	<link rel="stylesheet" href="{{ url_for('static',filename='js/simpleboot/font-awesome/4.4.0/css/font-awesome-ie7.min.css') }}">
	<![endif]-->
    <script type="text/javascript">
        //全局变量
        var GV = {
            ROOT: "/",
            WEB_ROOT: "",
            JS_ROOT: "{{ url_for('static',filename='js/') }}",
            UPLOAD_URL: "/"
        };
    </script>
    <script src="{{ url_for('static',filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static',filename='js/wind.js') }}"></script>
    <script src="{{ url_for('static',filename='js/simpleboot/bootstrap/js/bootstrap.min.js') }}"></script>
    <script>
        $(function () {
            $("[data-toggle='tooltip']").tooltip();
        });
    </script>
</head>
<body>
{% block topbar %}
{% include "rbac/_topbar.html" %}
{% endblock %}
{% block content %}{% endblock %}
<script src="{{ url_for('static',filename='js/md5.js') }}"></script>
<script src="{{ url_for('static',filename='js/signs.js') }}"></script>
<script src="{{ url_for('static',filename='js/requests.js') }}"></script>
<script src="{{ url_for('static',filename='js/common.js') }}"></script>
{% block js %}{% endblock %}
</body>
</html>

# 与 docker-compose.yml 相同（兼容旧文档中的 -f docker-compose.run.yml）
services:
  cronpilot:
    build: .
    ports:
      - "5860:5860"
    volumes:
      - ./datas:/opt/cronpilot/datas
      - ./conf.ini:/opt/cronpilot/conf.ini
    environment:
      FLASK_CONFIG: production
      PYTHONIOENCODING: utf-8
      # 可选：显式注入；未设置时 run_production.sh 会写入 datas/.flask_secret_key
      # SECRET_KEY: ${SECRET_KEY}
    restart: unless-stopped

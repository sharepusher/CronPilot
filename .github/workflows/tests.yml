name: Unit tests

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'datas/**'
      - 'configs.py'
      - 'config.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'conf.ini.example'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'datas/**'
      - 'configs.py'
      - 'config.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'conf.ini.example'
      - '.github/workflows/tests.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies (3.8–3.11)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Prepare conf.ini for import side effects
        run: cp conf.ini.example conf.ini

      - name: Run P0 and sign unit tests
        run: |
          python -m unittest tests.test_p0_phase_a tests.test_cronpilot_sign -v

  install-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install full requirements (Gunicorn + gevent)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

name: Public release asset

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-validate-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate documentation image governance
        run: python scripts/check_doc_image_assets.py --check

      - name: Build deterministic asset twice
        run: |
          python scripts/build_release_asset.py --version "$VERSION" --ref "$GITHUB_REF_NAME" --output "dist/cronpilot-$VERSION.tar.gz"
          python scripts/build_release_asset.py --version "$VERSION" --ref "$GITHUB_REF_NAME" --output "dist/rebuild-cronpilot-$VERSION.tar.gz"
          cmp "dist/cronpilot-$VERSION.tar.gz" "dist/rebuild-cronpilot-$VERSION.tar.gz"

      - name: Validate public asset contract
        run: python scripts/check_release_asset.py --archive "dist/cronpilot-$VERSION.tar.gz" --version "$VERSION"

      - name: Prepare versioned GitHub Release notes
        run: python scripts/extract_release_notes.py --version "$VERSION" --output dist/release-notes.md

      - name: Verify extracted installation and startup
        run: |
          mkdir -p "$RUNNER_TEMP/cronpilot-release-check"
          tar -xzf "dist/cronpilot-$VERSION.tar.gz" -C "$RUNNER_TEMP/cronpilot-release-check"
          cd "$RUNNER_TEMP/cronpilot-release-check/cronpilot-$VERSION"
          bash scripts/bootstrap_venv.sh
          bash scripts/verify_golden_path.sh

      - name: Create or refresh draft Release, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/cronpilot-$VERSION.tar.gz"
            "dist/cronpilot-$VERSION.tar.gz.sha256"
            "dist/cronpilot-$VERSION.tar.gz.build.json"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "CronPilot $VERSION" \
              --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "CronPilot $VERSION" \
              --notes-file dist/release-notes.md
          fi
          release_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            asset_name="${asset#dist/}"
            if ! grep -Fqx "$asset_name" <<<"$release_assets"; then
              echo "Release asset is missing after upload: $asset_name" >&2
              exit 1
            fi
          done
          release_body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          for required_text in \
            "cronpilot-$VERSION.tar.gz" \
            "cronpilot-$VERSION.tar.gz.sha256" \
            "Source code" \
            "not recommended for production deployment"; do
            if ! grep -Fq "$required_text" <<<"$release_body"; then
              echo "Release body is missing required deployment-boundary text: $required_text" >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

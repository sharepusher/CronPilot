<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>补全个人信息 — CronPilot</title>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console-theme.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cp-bg);
      padding: 20px;
      color: var(--cp-text);
    }
    .auth-card {
      width: 420px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      padding: 36px 30px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 28px;
      color: var(--cp-text);
    }
    .auth-logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--cp-signal);
      display: inline-block;
      flex-shrink: 0;
    }
    .auth-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .auth-subtitle { font-size: 12.5px; color: var(--cp-text-muted); margin-bottom: 20px; }
    .auth-banner {
      background: var(--cp-warn-bg);
      border: 1px solid var(--cp-warn-border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--cp-warn-dark);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .auth-field { margin-bottom: 16px; }
    .auth-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .auth-req { color: var(--cp-danger); }
    .auth-input,
    .auth-select {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border-strong);
      border-radius: 6px;
      color: var(--cp-text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-input:disabled {
      background: var(--cp-surface-2);
      color: var(--cp-text-muted);
      cursor: not-allowed;
    }
    .auth-select { appearance: auto; }
    .auth-input:focus,
    .auth-select:focus {
      outline: none;
      border-color: var(--cp-signal);
      box-shadow: 0 0 0 2px var(--cp-signal-bg);
    }
    .auth-input::placeholder { color: var(--cp-text-faint); }
    .auth-other-wrap { display: none; margin-top: 8px; }
    .auth-msg-err {
      background: var(--cp-danger-bg);
      border: 1px solid var(--cp-danger-border);
      color: var(--cp-danger);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .auth-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 24px;
    }
    .auth-logout-form {
      margin-top: 10px;
      text-align: center;
    }
    .auth-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 6px;
      background: var(--cp-signal);
      color: var(--cp-on-filled);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.12s;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-btn-secondary {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 16px;
      border: 1px solid var(--cp-border-strong);
      border-radius: 6px;
      background: var(--cp-surface);
      color: var(--cp-text-muted);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .auth-btn-secondary:hover { background: var(--cp-surface-2); color: var(--cp-text); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-dot"></span>CronPilot
    </div>
    <div class="auth-title">补全个人信息</div>
    <div class="auth-subtitle">首次使用前请填写以下信息，完成后即可进入系统</div>

    <div class="auth-banner">
      首次使用前请补全以下个人信息，填写完成后即可进入系统。
    </div>

    {% if form_msg %}
    <div class="auth-msg-err">{{ form_msg }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('rbac.complete_profile') }}" id="profile-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="auth-field">
        <label class="auth-label">当前账号</label>
        <input type="text" class="auth-input" value="{{ user.username }}" disabled />
      </div>

      {% if not user.email %}
      <div class="auth-field">
        <label class="auth-label" for="cp-email">邮箱 <span class="auth-req">*</span></label>
        <input type="email" id="cp-email" name="email" class="auth-input" maxlength="128" required placeholder="user@company.com" />
      </div>
      {% else %}
      <div class="auth-field">
        <label class="auth-label">邮箱</label>
        <input type="text" class="auth-input" value="{{ user.email }}" disabled />
        <input type="hidden" name="email" value="{{ user.email }}" />
      </div>
      {% endif %}

      {% if not user.nickname %}
      <div class="auth-field">
        <label class="auth-label" for="cp-nickname">花名 <span class="auth-req">*</span></label>
        <input type="text" id="cp-nickname" name="nickname" class="auth-input" maxlength="64" required />
      </div>
      {% else %}
      <div class="auth-field">
        <label class="auth-label">花名</label>
        <input type="text" class="auth-input" value="{{ user.nickname }}" disabled />
        <input type="hidden" name="nickname" value="{{ user.nickname }}" />
      </div>
      {% endif %}

      {% if not user.job_title %}
      <div class="auth-field">
        <label class="auth-label" for="cp-job-title-select">岗位类型 <span class="auth-req">*</span></label>
        <select name="job_title" id="cp-job-title-select" class="auth-select" required>
          <option value="">-- 请选择 --</option>
          {% for code, label in job_title_choices %}
          <option value="{{ code }}">{{ label }}</option>
          {% endfor %}
        </select>
        <div class="auth-other-wrap" id="cp-job-title-other-wrap">
          <input type="text" name="job_title_other" class="auth-input" maxlength="20" placeholder="具体岗位（限 20 字符）" />
        </div>
      </div>
      {% else %}
      <div class="auth-field">
        <label class="auth-label">岗位类型</label>
        <input type="text" class="auth-input" value="{{ user.job_title }}" disabled />
        <input type="hidden" name="job_title" value="{{ user.job_title }}" />
      </div>
      {% endif %}

      <div class="auth-actions">
        <button type="submit" class="auth-btn" id="profile-submit">保存并继续</button>
      </div>
    </form>

    <form method="post" action="{{ url_for('rbac.logout') }}" class="auth-logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="auth-btn-secondary">退出登录</button>
    </form>
  </div>

  <script>
  (function() {
    var sel = document.getElementById('cp-job-title-select');
    var wrap = document.getElementById('cp-job-title-other-wrap');
    if (sel && wrap) {
      sel.addEventListener('change', function() {
        wrap.style.display = this.value === 'other' ? 'block' : 'none';
      });
    }

    var form = document.getElementById('profile-form');
    var submitBtn = document.getElementById('profile-submit');
    if (form && submitBtn) {
      form.addEventListener('submit', function() {
        if (submitBtn.disabled) return false;
        submitBtn.disabled = true;
        submitBtn.textContent = '保存中…';
      });
    }
  })();
  </script>
</body>
</html>

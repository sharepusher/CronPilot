name: Public release asset

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
      repair_published:
        description: Add missing assets to an existing published release without overwriting
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Validate target before checkout
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT_TAG"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Malformed release tag" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ steps.target.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Record immutable build source
        id: source
        run: |
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Check version and release-note consistency
        run: python scripts/check_version_consistency.py --check --tag "$RELEASE_TAG"

      - name: Verify structured release readiness
        run: |
          jq -e --arg version "$VERSION" \
            '.version == $version and (.readiness == "ready" or .readiness == "published") and .release_blockers == []' \
            release/release-manifest.json >/dev/null

      - name: Validate documentation image governance
        run: python scripts/check_doc_image_assets.py --check

      - name: Verify historical QA image migration
        run: python scripts/check_qa_image_migration.py

      - name: Build deterministic asset twice
        run: |
          python scripts/build_release_asset.py --version "$VERSION" --ref "$RELEASE_TAG" --output "dist/cronpilot-$VERSION.tar.gz"
          python scripts/build_release_asset.py --version "$VERSION" --ref "$RELEASE_TAG" --output "dist/rebuild-cronpilot-$VERSION.tar.gz"
          cmp "dist/cronpilot-$VERSION.tar.gz" "dist/rebuild-cronpilot-$VERSION.tar.gz"
          cp release/release-manifest.json "dist/release-manifest.json"

      - name: Validate public asset contract
        run: python scripts/check_release_asset.py --archive "dist/cronpilot-$VERSION.tar.gz" --version "$VERSION"

      - name: Prepare versioned GitHub Release notes
        run: python scripts/extract_release_notes.py --version "$VERSION" --output dist/release-notes.md --require-version-section

      - name: Verify extracted installation and startup
        run: |
          mkdir -p "$RUNNER_TEMP/cronpilot-release-check"
          tar -xzf "dist/cronpilot-$VERSION.tar.gz" -C "$RUNNER_TEMP/cronpilot-release-check"
          cd "$RUNNER_TEMP/cronpilot-release-check/cronpilot-$VERSION"
          bash scripts/bootstrap_venv.sh
          bash scripts/verify_golden_path.sh

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ needs.build-validate.outputs.release_tag }}
      cancel-in-progress: false
    environment:
      name: release
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: release-assets
          path: dist

      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-validate.outputs.release_tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build-validate.outputs.source_commit }}
          EVENT_NAME: ${{ github.event_name }}
          REPAIR_PUBLISHED: ${{ inputs.repair_published }}
        run: |
          set -euo pipefail
          : "${GH_REPO:?Repository context is required}"
          : "${GH_TOKEN:?Authentication is required}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          VERSION="${RELEASE_TAG#v}"
          assets=(
            "dist/cronpilot-$VERSION.tar.gz"
            "dist/cronpilot-$VERSION.tar.gz.sha256"
            "dist/cronpilot-$VERSION.tar.gz.build.json"
          )
          # Resolve lightweight and annotated tags through the API, without checkout.
          verify_tag_source() {
            local object kind sha depth
            object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
            for depth in {1..10}; do
              kind="$(jq -er '.object.type' <<<"$object")"
              sha="$(jq -er '.object.sha' <<<"$object")"
              if [ "$kind" = commit ]; then
                test "$sha" = "$EXPECTED_SOURCE_COMMIT"
                return
              fi
              test "$kind" = tag
              object="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            done
            echo "Tag resolution exceeded the safe depth" >&2
            return 1
          }
          verify_tag_source
          jq -e --arg commit "$EXPECTED_SOURCE_COMMIT" --arg version "$VERSION" --arg tag "$RELEASE_TAG" \
            '.source_commit == $commit and .version == $version and .source_ref == $tag' \
            "dist/cronpilot-$VERSION.tar.gz.build.json" >/dev/null
          jq -e --arg version "$VERSION" \
            '.version == $version and (.readiness == "ready" or .readiness == "published") and .release_blockers == []' \
            dist/release-manifest.json >/dev/null
          (cd dist && sha256sum -c "cronpilot-$VERSION.tar.gz.sha256")
          # A failed API request must never be mistaken for a missing release.
          pages="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")"
          release="$(jq -ce --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | if length <= 1 then . else error("Duplicate release tag") end' <<<"$pages")"
          count="$(jq 'length' <<<"$release")"
          published=false
          if [ "$count" = 1 ]; then
            published="$(jq -r '.[0].draft == false' <<<"$release")"
          fi
          if [ "$published" = true ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$REPAIR_PUBLISHED" != true ]; then
              echo "Published releases require explicit manual repair authorization" >&2
              exit 1
            fi
            jq -e '.[0].immutable != true' <<<"$release" >/dev/null
            release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            mkdir -p existing-assets
            missing=()
            # Complete the conflict preflight before the first write.
            for asset in "${assets[@]}"; do
              name="${asset#dist/}"
              if grep -Fqx "$name" <<<"$release_assets"; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir existing-assets --clobber
                cmp "$asset" "existing-assets/$name"
              else
                missing+=("$asset")
              fi
            done
            verify_tag_source
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${missing[@]}"
            fi
          else
            # Validate release-note boundaries before creating or updating a draft.
            release_body="$(cat dist/release-notes.md)"
            for required_text in "cronpilot-$VERSION.tar.gz" "cronpilot-$VERSION.tar.gz.sha256" \
              "Source code" "not recommended for production deployment"; do
              grep -Fq "$required_text" <<<"$release_body"
            done
            verify_tag_source
            if [ "$count" = 1 ]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              gh release edit "$RELEASE_TAG" --title "CronPilot $VERSION" --notes-file dist/release-notes.md
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag \
                --title "CronPilot $VERSION" --notes-file dist/release-notes.md
            fi
          fi
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          jq -e --arg tag "$RELEASE_TAG" --argjson published "$published" \
            '.tagName == $tag and .isDraft == ($published | not)' <<<"$release_state" >/dev/null
          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mkdir -p remote-assets
          for asset in "${assets[@]}"; do
            name="${asset#dist/}"
            grep -Fqx "$name" <<<"$release_assets"
            gh release download "$RELEASE_TAG" --pattern "$name" --dir remote-assets --clobber
            cmp "$asset" "remote-assets/$name"
          done
          (cd remote-assets && sha256sum -c "cronpilot-$VERSION.tar.gz.sha256")
          jq -e --arg commit "$EXPECTED_SOURCE_COMMIT" '.source_commit == $commit' \
            "remote-assets/cronpilot-$VERSION.tar.gz.build.json" >/dev/null
          verify_tag_source
          if [ "$published" = false ]; then
            release_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            cmp dist/release-notes.md <(printf '%s\n' "$release_body")
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

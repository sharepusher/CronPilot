<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 — CronPilot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console-theme.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cp-bg);
      padding: 20px;
      color: var(--cp-text);
    }
    .auth-card {
      width: 380px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 28px;
      justify-content: center;
      color: var(--cp-text);
    }
    .auth-logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--cp-signal);
      display: inline-block;
      flex-shrink: 0;
    }
    .auth-lock-icon {
      margin-bottom: 16px;
      color: var(--cp-text-faint);
    }
    .auth-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .auth-desc {
      font-size: 13px;
      color: var(--cp-text-muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .auth-info-box {
      background: var(--cp-surface-2);
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      padding: 14px;
      font-size: 12.5px;
      color: var(--cp-text-muted);
      line-height: 1.6;
      text-align: left;
    }
    .auth-info-box strong { color: var(--cp-text); }
    .auth-back {
      display: inline-block;
      margin-top: 20px;
      color: var(--cp-signal);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .auth-back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-dot"></span>CronPilot
    </div>
    <svg class="auth-lock-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="4" y="10" width="16" height="10" rx="2"/>
      <path d="M8 10V7a4 4 0 018 0v3"/>
      <circle cx="12" cy="15" r="1.5"/>
    </svg>
    <div class="auth-title">忘记密码？</div>
    <div class="auth-desc">
      出于安全考虑，CronPilot 不支持自助密码重置。<br>请联系你的管理员为你重置密码。
    </div>
    <div class="auth-info-box">
      <strong>你可以：</strong><br>
      1. 联系业务组管理员，请求重置密码<br>
      2. 管理员操作路径：用户管理 → 找到你的账号 → 重置密码<br>
      3. 重置后你将在登录时被要求设置新密码
    </div>
    <a class="auth-back" href="{{ url_for('rbac.login') }}">← 返回登录</a>
  </div>
</body>
</html>

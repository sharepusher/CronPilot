name: Unit tests

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'datas/**'
      - 'configs.py'
      - 'config.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'conf.ini.example'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'datas/**'
      - 'configs.py'
      - 'config.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'conf.ini.example'
      - '.github/workflows/tests.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare conf.ini for import side effects
        run: cp conf.ini.example conf.ini

      - name: Run P0 and sign unit tests
        run: |
          python -m unittest tests.test_p0_phase_a tests.test_cronpilot_sign -v
